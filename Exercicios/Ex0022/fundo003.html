<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posição dos fundos</title>
    <style>
        .bloco{
            height: 200px;
            width: 65%; /* Declarei a largura como 65% da tela para caber melhor na tela */
            border: 3px solid black;
            margin: 10px;
            border-radius: 10px;
            background-image: url(imagens/wallpaper002.jpg);
        }

        div#q1{
            background-position: left top; /* Ponto de partida: Do lado esquerdo da imagem na altura superior */
        }

        div#q2{
            background-position: left center; /* Ponto de partida: Do lado esquerdo da imagem no centro */
        }

        div#q3{
            background-position: right bottom; /* Ponto de partida:  Do lado direito da imagem na altura inferior */
        }

        div#q4{
            background-position: center center; /* Ponto de partida:  No centro da imagem */
        }

    </style>
</head>
<body>

    <div class="bloco" id="q1">

    </div>

    <div class="bloco" id="q2">

    </div>

    <div class="bloco" id="q3">

    </div>

    <div class="bloco" id="q4">


    </div>
    
</body>
</html>
