<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamento</title>
    <style>
        body{
            height: 98vh; /*Definindo a altura do body como 98% da altura da tela do dispositivo */
            background-image: url('https://gustavoguanabara.github.io/html-css/imagens/mascote.png'); /*Imagem de fundo do body, aqui não temos a imagem baixada no PC estamos importando ela direto da web (também é possível) */
            background-size: 100px; /*Definindo o tamanho da imagem de fundo */
            background-repeat: no-repeat; /*Aqui estou dizendo que a imagem de fundo não pode se repetir */
            background-position: center center; /*Aqui estou dizendo que a imagem de fundo deve ficar centralizada tanto na horizontal quanto na vertical */
        }

    </style>
</head>
<body>
    
</body>
</html>
