<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamneto</title>
    <style>
        body{
            height: 98vh; /*Definindo a altura do body como 98% da altura da tela do dispositivo */
            background-size: 100%; /*Definindo o tamanho da imagem de fundo, definindo-a para ocupar 100% da tela */
            background-repeat: no-repeat; /*Aqui estou dizendo que a imagem de fundo não pode se repetir */
            background-image: url(imagens/wallpaper003.jpg);
            background-position: center center; /*Aqui estou dizendo que a imagem de fundo deve ficar centralizada tanto na horizontal quanto na vertical */
        }
    </style>
</head>

</body>
</html>
